<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>郑大菜单核实工作台 · 仅本地</title><link rel="stylesheet" href="styles.css"></head><body>
<header><div><p class="eyebrow">郑大吃什么 · 本地维护</p><h1>逐条核实，才上菜单。</h1></div><span class="local-badge">仅本地草稿 · 不自动发布</span></header>
<main><p class="notice">这里展示待核实资料与旧版差异，不能作为当前供应菜单。保存草稿不会提高核实状态；正式写入仍须通过证据、素材和基线校验。</p><section id="summary" class="summary" aria-label="菜库统计"></section>
<div class="toolbar"><label>查找记录<input id="search" type="search" placeholder="菜名、旧餐厅或稳定ID"></label><label>查看范围<select id="scope"><option value="all">全部记录</option><option value="gap">有证据缺口</option><option value="conflict">来源争议</option><option value="group">同名多条记录</option><option value="image">素材需修正</option><option value="changed">已暂存修改</option></select></label><button id="export" class="primary">导出批量草稿</button><label class="import-label">载入草稿<input id="import" type="file" accept="application/json,.json"></label></div>
<p id="status" role="status" aria-live="polite"></p><div class="workspace"><aside><h2 id="listTitle">餐品记录</h2><div id="list" class="record-list" role="group" aria-labelledby="listTitle"></div></aside><section id="detail" class="detail" aria-label="记录与差异"></section></div>
<section class="sources"><h2>来源与历史线索</h2><p>历史线索只按规范菜名关联；同名不代表同一个窗口，关联不代表核实。</p><details><summary>25条历史线索与旧记录对应</summary><div id="historical"></div></details><details><summary>各餐厅来源、访问状态及位置资料</summary><pre id="sources"></pre></details></section></main>
<script type="module" src="app.js"></script></body></html>
